[workspace]
resolver = "2"
members = [
    "crates/paper5-core",
    "crates/paper5-py",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2021"
authors = [
    "Ian T. Helfrich <ianthelfrich@gmail.com>",
    "Elizaveta Gonchar",
]
license = "MIT"
repository = "https://github.com/helfrich/paper5-effective-distance"

[workspace.dependencies]
petgraph = "0.6"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
anyhow = "1"
thiserror = "1"
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
