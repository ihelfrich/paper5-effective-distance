[project]
name = "paper5"
version = "0.1.0.dev"
description = "Effective Distance: A Satellite-Calibrated Bilateral Trade-Cost Panel (Gonchar & Helfrich, 2026)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Elizaveta Gonchar" },
  { name = "Ian T. Helfrich", email = "ianthelfrich@gmail.com" },
]
dependencies = [
  # Core data
  "pandas>=2.2",
  "polars>=1.0",
  "duckdb>=1.0",
  "pyarrow>=15.0",
  "numpy>=1.26",
  # Geospatial / raster
  "rioxarray>=0.15",
  "xarray>=2024.3",
  "dask>=2024.4",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  # Network / routing
  "networkx>=3.3",
  "osmnx>=1.9",
  "pyrosm>=0.6",
  # Gravity estimation
  "pyfixest>=0.20",
  "statsmodels>=0.14",
  # Plotting
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "plotly>=5.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "mypy>=1.10",
  "jupyterlab>=4.1",
  "maturin>=1.5",   # build Rust extension (crates/paper5-py)
  "snakemake>=8.0", # workflow orchestration (L0→L4 DAG)
]
gpu = [
  # Optional: pyfixest GPU demeaning
  "cupy-cuda12x",
  "torch>=2.2",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
